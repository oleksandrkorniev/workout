<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="format-detection" content="telephone=no">
<title>Workout</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cg stroke='%23c3f53c' stroke-width='5.5' stroke-linecap='round' fill='none'%3E%3Cpath d='M21 20v24M43 20v24M11 26v12M53 26v12M21 32h22'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0b0d10; --card:#14171c; --card2:#1a1e24; --line:#262c34;
  --tx:#f2f5f7; --dim:#8b96a2; --acc:#c3f53c; --warm:#ff8a3d; --bad:#ff5f57;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{
  background:var(--bg); color:var(--tx);
  font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
#app{max-width:560px;margin:0 auto;padding:20px 18px 8px}
h1{font-size:27px;margin:0;letter-spacing:-.4px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:22px 0 10px;font-weight:600}
.sub{color:var(--dim);font-size:15px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.badge{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:6px 12px;border-radius:999px}
.badge.big{font-size:15px;padding:9px 18px;letter-spacing:.09em}
.badge.bulk{background:rgba(255,138,61,.15);color:var(--warm)}
.badge.cut{background:rgba(195,245,60,.15);color:var(--acc)}
.badge.maintain{background:rgba(139,152,169,.16);color:var(--dim)}
.badge.rest{background:rgba(139,152,169,.16);color:var(--dim)}
.stat{display:flex;gap:8px;margin-top:14px}
.stat > div{flex:1;background:var(--card2);border-radius:13px;padding:12px 11px;min-width:0}
.stat .k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.wicon{display:inline-flex;width:23px;height:23px;flex:none;color:var(--dim)}
.wicon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ibtn{width:45px;height:45px;border-radius:12px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.ibtn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ibtn.on{border-color:var(--acc);color:var(--acc);background:rgba(195,245,60,.1)}
.daychip{width:40px;height:40px;border-radius:99px;padding:0;font-weight:600;font-size:15px;color:var(--dim);flex:none}
.daychip.on{background:var(--acc);border-color:var(--acc);color:#0f1400}
.stat .v{font-size:22px;font-weight:650;letter-spacing:-.5px;margin-top:4px;white-space:nowrap}
.stat .v small{font-size:13px;font-weight:500;color:var(--dim)}
.bar{height:8px;background:#222a34;border-radius:99px;overflow:hidden;margin-top:9px}
.bar > i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.warm > i{background:var(--warm)}
/* week date strip */
.strip{display:flex;align-items:center;gap:0;margin:0 0 18px}
.strip button.x{padding:6px 3px;font-size:22px}
.strip .cells{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;flex:1}
.dcell{text-align:center;cursor:pointer;user-select:none;padding:2px 0}
.dcell .dw{font-size:12px;color:var(--dim);margin-bottom:6px}
.dcell .dn{width:42px;height:42px;margin:0 auto;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}
.dcell.istoday .dn{box-shadow:inset 0 0 0 1.5px rgba(195,245,60,.55)}
.dcell.sel .dn{background:var(--acc);color:#0f1400;box-shadow:none}
.dcell .dot{width:5px;height:5px;border-radius:99px;margin:5px auto 0;background:transparent}
.dcell .dot.plan{background:var(--dim)}
.dcell .dot.part{background:var(--warm)}
.dcell .dot.full{background:var(--acc)}
.tap{cursor:pointer}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card2);
  margin:-18px -18px 12px;padding:13px 18px;border-radius:var(--r) var(--r) 0 0;border-bottom:1px solid var(--line)}
.chead.solo{margin-bottom:-18px;border-radius:var(--r);border-bottom:0}
.dragh{color:var(--dim);font-size:17px;letter-spacing:1px;padding:8px 10px 8px 2px;cursor:grab;touch-action:none;user-select:none;flex:none;line-height:1}
.gripbar{display:flex;justify-content:center;margin:-8px 0 2px}
.gripbar .dragh{padding:2px 26px;font-size:15px}
.dragging{opacity:.45}
.pchip{display:inline-flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.pchip button{background:none;border:0;padding:11px 6px 11px 17px;font-size:15px;font-weight:600}
.pchip .pdel{padding:11px 15px 11px 6px;color:var(--dim);font-size:17px}
.ex{border-top:1px solid var(--line);padding:16px 0}
.ex:first-of-type{border-top:0;padding-top:4px}
.chead + .ex{border-top:0;padding-top:4px}
.ex .name{font-weight:600;font-size:18px}
.target{color:var(--dim);font-size:15px;margin-top:3px}
.up{color:var(--acc);font-weight:600}
.chk{width:54px;height:54px;border-radius:99px;border:2px solid #334050;background:var(--card2);
  color:transparent;font-size:22px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.chk.on{background:var(--acc);border-color:var(--acc);color:#0f1400}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;-webkit-appearance:none;font-size:17px}
input:focus,select:focus{outline:none;border-color:#3b4a5e}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:5px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
button{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;user-select:none}
button:active{transform:translateY(1px)}
button.pri{background:var(--acc);border-color:var(--acc);color:#0f1400;font-weight:650}
button.ghost{background:transparent}
button.sm{padding:11px 17px;font-size:15px;border-radius:11px}
button.x{background:transparent;border:0;color:var(--dim);padding:12px;font-size:20px;line-height:1}
button.x:hover{color:var(--bad)}
.exedit{border-top:1px solid var(--line);padding:12px 0 10px}
.exedit:first-of-type{border-top:0}
.exedit .f3{margin-top:8px}
.exedit label{margin-bottom:4px}
.muted{color:var(--dim)}
.tiny{font-size:14px;color:var(--dim)}
.ring{width:60px;height:60px;flex:none}
.ring text{fill:var(--tx);font-size:12px;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,13,16,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{background:none;border:0;color:var(--dim);font-size:13px;font-weight:600;padding:11px 0;display:grid;gap:4px;justify-items:center}
nav button.on{color:var(--acc)}
nav svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.hist{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.hist:last-child{border-bottom:0}
.bigring{width:296px;height:296px;max-width:100%}
.arc{filter:drop-shadow(0 0 11px rgba(195,245,60,.32))}
.ringwrap{display:flex;justify-content:center;padding:30px 0 0;
  background:radial-gradient(circle at 50% 52%, rgba(195,245,60,.07), transparent 62%)}
.trow{display:flex;gap:18px;align-items:stretch}
.tcol{flex:1;min-width:0}
.tdiv{width:1px;background:var(--line)}
.tval{font-size:27px;font-weight:700;letter-spacing:-.6px;margin-top:7px;white-space:nowrap}
.tgoal{font-size:15px;color:var(--dim);font-weight:500;letter-spacing:0}
.k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.modebtn{display:inline-flex;align-items:center;gap:8px;padding:10px 13px 10px 15px;border-radius:99px;
  font-weight:650;font-size:15px;color:var(--dim);background:var(--card);border:1px solid var(--line)}
.modebtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.modebtn.on{color:var(--tx);border-color:#3a4a5c}
.sw{width:37px;height:22px;border-radius:99px;background:#2b3544;position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;top:2.5px;left:2.5px;width:17px;height:17px;border-radius:99px;background:var(--dim);transition:transform .15s ease,background .15s}
.modebtn.on .sw{background:var(--acc)}
.modebtn.on .sw i{transform:translateX(14.5px);background:#0f1400}
.addbtn{display:block;width:100%;background:transparent;border:1.5px dashed #334050;color:var(--dim);
  border-radius:var(--r);padding:17px;font-weight:600;font-size:17px;margin-bottom:14px}
.addbtn:hover{color:var(--tx);border-color:#4a5a6e}
.iconbtn{width:48px;height:48px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--dim)}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on{color:var(--acc);border-color:rgba(195,245,60,.45)}
.wide{display:inline-flex;width:100%;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-weight:600;font-size:16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);
  border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  max-height:86vh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  animation:sheetup .22s ease}
@keyframes sheetup{from{transform:translateY(48px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet.noanim{animation:none}
.shead{padding:18px 18px 6px;font-size:19px;font-weight:650;flex:none}
.sbody{padding:2px 18px 6px;overflow-y:auto;flex:1;min-height:0}
.sfoot{display:flex;gap:10px;padding:14px 18px calc(16px + env(safe-area-inset-bottom));flex:none;border-top:1px solid var(--line)}
.sfoot button{flex:1}
.foot{display:flex;gap:8px;margin:18px 0 6px}
.foot button{flex:1;font-size:13px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card2);
  border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-top:9px;cursor:pointer;user-select:none}
.opt:active{transform:translateY(1px)}
.opt.on{border-color:rgba(195,245,60,.6);background:rgba(195,245,60,.08)}
.opt .ck{width:25px;height:25px;border-radius:99px;border:1.5px solid #334050;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.opt.on .ck{background:var(--acc);border-color:var(--acc);color:#0f1400}
.opt .oname{font-weight:600;font-size:17px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;color:var(--dim);font-size:14px;font-weight:650;padding:8px 16px;border-radius:99px}
.seg button.on{color:var(--acc);background:rgba(195,245,60,.14)}
.seg button.on.warm{color:var(--warm);background:rgba(255,138,61,.14)}
.okbtn{width:40px;height:40px;border-radius:99px;background:var(--acc);border:0;color:#0f1400;
  font-size:17px;font-weight:750;flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.fab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:40;
  background:var(--acc);border:0;color:#0f1400;border-radius:99px;padding:15px 24px;
  font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.pcar{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:2px -18px 0;padding:0 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pcar::-webkit-scrollbar{display:none}
.pslide{flex:0 0 100%;scroll-snap-align:center;min-width:0}
.pframe{position:relative;width:100%;height:min(66vh,600px);border-radius:20px;overflow:hidden;background:var(--card2);cursor:pointer}
.pframe img{width:100%;height:100%;object-fit:cover;display:block}
.pgrad{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,transparent 24%,transparent 50%,rgba(11,13,16,.88) 100%)}
.pmeta{position:absolute;left:18px;right:18px;bottom:16px;color:#fff;pointer-events:none}
.pday{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);margin-bottom:3px}
.pbig{font-size:23px;font-weight:750;letter-spacing:-.3px}
.psub{font-size:14px;color:rgba(233,238,245,.72);margin-top:3px}
.pxdel{position:absolute;top:12px;right:12px;background:rgba(11,13,16,.55);backdrop-filter:blur(6px);
  border:0;color:#fff;border-radius:99px;min-width:38px;height:38px;padding:0 13px;font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.pxdel.armed{background:var(--bad);font-size:13px;font-weight:650}
.pdots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.pdots i{width:6px;height:6px;border-radius:99px;background:#2b3544;transition:all .15s}
.pdots i.on{background:var(--acc);width:18px}
.pcount{text-align:center;margin-top:13px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.04em}
</style>
</head>
<body>
<div id="app">
  <div class="between" style="margin-bottom:16px">
    <div>
      <h1 id="hTitle">Today</h1>
      <div class="sub" id="hSub"></div>
    </div>
    <div id="hRight"></div>
  </div>
  <main id="view"></main>
</div>
<nav><div class="in" id="nav"></div></nav>
<div id="sheetRoot"></div>
<div id="fabRoot"></div>

<script>
"use strict";
const KEY = "workout.v1";
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const uid = () => Math.random().toString(36).slice(2,9);
const num = (v, d=0) => { const n = parseFloat(String(v).replace(",",".")); return isNaN(n) ? d : n; };
const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- dates ---------- */
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseIso = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const dayIdx = d => ((d.getDay() + 6) % 7) + 1;            // 1 = Monday ... 7 = Sunday
const mondayOf = d => { const x = startOfDay(d); x.setDate(x.getDate() - (dayIdx(x) - 1)); return x; };

/* ---------- state ---------- */
function seed(){
  const ex = (name, sets, reps, weight) => ({ id: uid(), name, sets, reps, weight });
  const act = (title, mins, days) => ({ id: uid(), title, type: "activity", mins, days });
  const wk = (title, exercises, days) => ({ id: uid(), title, exercises, days });
  const today = new Date();
  return {
    profile: {
      mode: "bulk",
      weightStart: 78, weightNow: 79.2, weightTarget: 84,
      fatStart: 18, fatNow: 17.4, fatTarget: 15,
      regimeDays: 90,
      anchor: iso(mondayOf(today))
    },
    measurements: [],
    workouts: [
      wk("Upper", [
        ex("Разминка",1,1,0),
        ex("Брусья",3,15,0),
        ex("Подтягивания",3,12,0),
        ex("Грудь в кроссовере",2,15,10.2),
        ex("Спина в кроссовере (2х2х15)",4,15,12.5),
        ex("Подъемы на предплечья (2х2х15)",4,15,12),
        ex("Обратные отжимания на трицепс на скамье под 45°",2,15,12),
        ex("Заминка",1,1,0)
      ], [1]),
      wk("Lower", [
        ex("Разминка",1,1,0),
        ex("Приседания с грифом (8-15-12-10, 0-10-15-20 кг)",4,12,20),
        ex("Подъемы на икры с гантелями на одной ноге (2х3х12)",6,12,15),
        ex("Присяды с гирей на подножке",2,15,16),
        ex("Подъемы на плечи на скамье",2,15,10),
        ex("Плечи в кроссовере (2х2х12)",4,12,11),
        ex("Заминка",1,1,0)
      ], [2]),
      act("Swimming", 45, [3, 6]),
      wk("Upper", [
        ex("Разминка",1,1,0),
        ex("Гантели лежа на скамье",3,15,8),
        ex("Тяга грифа вниз в кроссовере",3,15,20),
        ex("Отжимания (Бабочка)",2,12,10),
        ex("Подтягивания (Тяга на себя)",2,20,25),
        ex("Молотки стоя",2,20,7),
        ex("Жим гантели из-за головы",2,15,15),
        ex("Заминка",1,1,0)
      ], [4]),
      wk("Lower", [
        ex("Разминка",1,1,0),
        ex("Квадрицепс в горизонтальном кроссовере",3,15,60),
        ex("Подъемы на икры в смите",3,20,30),
        ex("Болгарские приседы",2,15,12),
        ex("Подъемы на икры сидя",2,20,35),
        ex("Плечи в кроссовере (2х2х15)",4,15,15),
        ex("Складывания на пресс на скамье",2,15,0),
        ex("Заминка",1,1,0)
      ], [5])
    ],
    planV2: true,
    backup: [wk("Home workout", [ex("Push-ups",4,15,0), ex("Air squats",4,20,0), ex("Plank, sec",3,60,0)])],
    homeDays: {},
    nutrition: { rules: [{ id: "water", name: "Water", kind: "count", target: 5, unit: "glasses" }], logs: {}, menu: [
      { id: uid(), name: "Breakfast", home: false },
      { id: uid(), name: "Lunch",     home: false },
      { id: uid(), name: "Dinner",    home: false }
    ], exclusions: [{ id: uid(), name: "Sugar", limit: 3, xcat: "snack" }], exlog: {} },
    rules: [
      { id: uid(), scope: "all", metric: "reps",   amount: 1, every: 1, cap: 4  },
      { id: uid(), scope: "all", metric: "weight", amount: 1, every: 2, cap: 20 }
    ],
    logs: {}
  };
}


let state, tab = "home";
let sel = iso(new Date());     // selected date on the main screen
let weekOffset = 0;            // which week the strip shows, 0 = current
let editing = false;           // Workout page in edit mode
let editTargets = false;       // targets form open on Home
let editN = false;             // nutrition rules edit mode
let showRules = false;         // autorules section expanded on Workout
let armed = null;              // destructive button awaiting second tap
let sheet = null;              // bottom sheet: { kind: "workout"|"menu", toBackup?, draft }
let sheetNew = false;          // sheet just opened -> play the slide-in once
let exOpen = null;             // exercise expanded inside an editor
let wkOpen = null;             // which workout is expanded in edit mode (accordion)
let wkHome = null;             // edit-mode section the open workout editor was opened in
let exHome = null;             // same for an open menu-item editor

/* ---------- progression engine ---------- */
function weeksElapsed(){
  const a = mondayOf(parseIso(state.profile.anchor || iso(new Date())));
  const w = Math.floor((mondayOf(new Date()) - a) / 6048e5);
  return Math.max(0, w);
}
function daysElapsed(){
  const a = parseIso(state.profile.anchor || iso(new Date()));
  return Math.max(1, Math.floor((startOfDay(new Date()) - a) / 864e5) + 1);
}
// one rule, evaluated at week w: raw growth, capped value, and whether it is finished
function ruleDelta(r, w){
  const every = Math.max(1, num(r.every, 1));
  const amt = num(r.amount, 0);
  const raw = Math.floor(w / every) * amt;
  const hasCap = r.cap != null && String(r.cap).trim() !== "";
  const cap = Math.abs(num(r.cap, 0));
  const val = !hasCap ? raw : (amt < 0 ? Math.max(raw, -cap) : Math.min(raw, cap));
  const capped = hasCap && Math.abs(raw + amt) > cap;
  return { every, amt, raw, val, capped, weeksToNext: every - (w % every) };
}
// total delta this exercise has earned from the autorules, by metric
function deltas(exId){
  const w = weeksElapsed();
  const out = { sets: 0, reps: 0, weight: 0, mins: 0 };
  for (const r of state.rules){
    if (r.scope !== "all" && r.scope !== exId) continue;
    if (out[r.metric] != null) out[r.metric] += ruleDelta(r, w).val;
  }
  return out;
}
function resolve(ex){
  const d = deltas(ex.id);
  if (ex.type === "time"){
    return { time: true, mins: Math.max(1, num(ex.mins, 30) + d.mins), d };
  }
  return {
    time: false,
    sets:   Math.max(1, num(ex.sets,1)   + d.sets),
    reps:   Math.max(1, num(ex.reps,1)   + d.reps),
    weight: Math.max(0, num(ex.weight,0) + d.weight),
    d
  };
}
const occursOn = (w, dateIso) => (w.days || []).includes(dayIdx(parseIso(dateIso)));
// which edit-mode section an item belongs to, relative to the selected day
const wkSec = w => (w.days || []).length ? (occursOn(w, sel) ? "today" : "other") : "unsched";
const mSec = m => !m.days ? "today" : !m.days.length ? "unsched" : m.days.includes(dayIdx(parseIso(sel))) ? "today" : "other";
const workoutsFor = dateIso => state.workouts.filter(w => occursOn(w, dateIso));
const effOf = (w, dateIso) => {
  const cid = (state.wopts[dateIso] || {})[w.id];
  return (cid && cid !== w.id && state.workouts.find(o => o.id === cid)) || w;
};
const unitsOf = w => w.type === "activity" ? [{ id: w.id, name: w.title, type: "time", mins: w.mins }] : w.exercises;
const exercisesFor = dateIso => workoutsFor(dateIso).flatMap(w => unitsOf(effOf(w, dateIso)));
const findWk = id => state.workouts.find(w => w.id === id) || state.backup.find(x => x.id === id) || null;

const exDone = (date, ex) => !!(state.logs[date] && state.logs[date][ex.id] && state.logs[date][ex.id].done);
function toggleDone(date, ex){
  const day = state.logs[date] || (state.logs[date] = {});
  if (!day[ex.id]) day[ex.id] = { done: false };
  day[ex.id].done = !day[ex.id].done;
}
function dayDone(date){
  const l = state.logs[date]; if (!l) return 0;
  return Object.values(l).filter(e => e.done).length;
}
function ring(pct, color = "var(--acc)"){
  const r = 21, c = 2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 52 52">
    <circle cx="26" cy="26" r="${r}" stroke="#222a34" stroke-width="5" fill="none"/>
    <circle cx="26" cy="26" r="${r}" stroke="${color}" stroke-width="5" fill="none" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 26 26)"/>
    <text x="26" y="30" text-anchor="middle">${Math.round(pct*100)}%</text>
  </svg>`;
}

function weekStrip(kind){
  const mon = mondayOf(new Date()); mon.setDate(mon.getDate() + weekOffset*7);
  const todayIso = iso(new Date());
  let cells = "";
  for (let i = 0; i < 7; i++){
    const d = new Date(mon); d.setDate(d.getDate() + i);
    const id = iso(d);
    let dot = "";
    const s = snapOf(id);
    if (kind === "nutrition"){
      const habs = s ? s.habits : state.nutrition.rules;
      if (habs.length){
        const done = habs.filter(r => habitDone(r, id)).length;
        dot = done >= habs.length ? "full" : done > 0 ? "part" : "plan";
      }
    } else {
      const exIds = s ? s.w.flatMap(w => w.exs.map(e => e.id)) : exercisesFor(id).map(e => e.id);
      if (exIds.length){
        const done = exIds.filter(eid => exDone(id, { id: eid })).length;
        dot = done >= exIds.length ? "full" : done > 0 ? "part" : "plan";
      }
    }
    cells += `<div class="dcell ${id===sel?"sel":""} ${id===todayIso?"istoday":""}" data-act="pick" data-date="${id}">
      <div class="dw">${DAYS[i][0]}</div>
      <div class="dn">${d.getDate()}</div>
      <div class="dot ${dot}"></div>
    </div>`;
  }
  return `<div class="strip">
    <button class="x" data-act="wshift" data-d="-1" title="Previous week">&lsaquo;</button>
    <div class="cells">${cells}</div>
    <button class="x" data-act="wshift" data-d="1" title="Next week">&rsaquo;</button>
  </div>`;
}

function wkCardView(w){
  const eff = effOf(w, sel);
  const hasAlts = state.workouts.some(o => o.id !== w.id);
  const origin = eff !== w ? `<div class="target">${esc(w.title)}</div>` : "";
  const titleAct = hasAlts ? `data-act="wchoose" data-w="${w.id}"` : "";
  if (eff.type === "activity"){
    const r = resolve({ id: eff.id, type: "time", mins: eff.mins });
    const on = exDone(sel, { id: eff.id });
    const bump = r.d.mins ? ` <span class="up">&uarr; ${(r.d.mins > 0 ? "+" : "") + fmt(r.d.mins)} min</span>` : "";
    return `<div class="card">
      <div class="chead solo">
        <div class="row grow" style="gap:10px">${wicon(eff)}
          <div class="grow ${hasAlts ? "tap" : ""}" ${titleAct}>
            <div style="font-size:19px;font-weight:650;${on ? "color:var(--dim);text-decoration:line-through" : ""}">${esc(eff.title)}</div>
            ${origin}
            <div class="target">${fmt(r.mins)} min${bump}</div>
          </div>
        </div>
        <div class="chk ${on ? "on" : ""}" data-act="exdone" data-ex="${eff.id}">&#10003;</div>
      </div>
    </div>`;
  }
  const total = (eff.exercises || []).length;
  let done = 0;
  const rows = (eff.exercises || []).map(ex => {
    const r = resolve(ex), on = exDone(sel, ex);
    if (on) done++;
    const sign = n => (n > 0 ? "+" : "") + fmt(n);
    const bump = [];
    if (r.time){
      if (r.d.mins) bump.push(`${sign(r.d.mins)} min`);
    } else {
      if (r.d.reps)   bump.push(`${sign(r.d.reps)} rep${Math.abs(r.d.reps) === 1 ? "" : "s"}`);
      if (r.d.weight) bump.push(`${sign(r.d.weight)} kg`);
      if (r.d.sets)   bump.push(`${sign(r.d.sets)} set${Math.abs(r.d.sets) === 1 ? "" : "s"}`);
    }
    const targetTxt = r.time ? `${fmt(r.mins)} min` : `${r.sets} &times; ${fmt(r.reps)}${r.weight ? ` @ ${fmt(r.weight)} kg` : ""}`;
    return `<div class="ex between">
      <div class="grow">
        <div class="name" style="${on ? "color:var(--dim);text-decoration:line-through" : ""}">${esc(ex.name)}</div>
        <div class="target">${targetTxt}
          ${bump.length ? `<span class="up">&nbsp;&uarr; ${bump.join(", ")}</span>` : ""}</div>
      </div>
      <div class="chk ${on ? "on" : ""}" data-act="exdone" data-ex="${ex.id}">&#10003;</div>
    </div>`;
  }).join("");
  const allDone = total > 0 && done === total;
  return `<div class="card">
    <div class="chead">
      <div class="row grow" style="gap:10px">${wicon(eff)}
        <div class="grow ${hasAlts ? "tap" : ""}" ${titleAct}>
          <div style="font-size:19px;font-weight:650;${allDone ? "color:var(--dim);text-decoration:line-through" : ""}">${esc(eff.title)}</div>
          ${origin}
        </div>
      </div>
      ${ring(total ? done/total : 0)}
    </div>${rows}</div>`;
}

function bigRing(endTxt){
  const p = state.profile;
  const total = Math.max(1, num(p.regimeDays, 90));
  const de = daysElapsed();
  const r = 63, C = 2 * Math.PI * r;
  const seg = C / total;
  const gap = Math.min(1.6, seg * 0.3);
  const todayIso = iso(new Date());
  const start = parseIso(p.anchor);
  let arcs = "";
  for (let i2 = 0; i2 < Math.min(de, total); i2++){
    const d = new Date(start); d.setDate(d.getDate() + i2);
    const ds = iso(d);
    const f = dayFlags(ds);
    let color = null;
    const fails = (f.wPlanned && !f.wOk ? 1 : 0) + (f.nTracked && !f.nOk ? 1 : 0);
    if (ds === todayIso){
      const doneOne = (f.wPlanned && f.wOk) || (f.nTracked && f.nOk);
      if (fails === 0 && (f.wPlanned || f.nTracked)) color = "var(--acc)";   // fully done -> green
      else if (doneOne) color = "var(--warm)";                               // one of two done -> orange
      else color = "#3a4656";                                               // nothing yet -> empty placeholder
    } else {
      color = fails === 0 ? "var(--acc)" : fails === 1 ? "var(--warm)" : "var(--bad)";
    }
    if (!color) continue;
    arcs += `<circle cx="75" cy="75" r="${r}" stroke="${color}" stroke-width="10" fill="none"
      stroke-dasharray="${(seg - gap).toFixed(2)} ${(C - seg + gap).toFixed(2)}"
      stroke-dashoffset="${(-i2 * seg).toFixed(2)}" transform="rotate(-90 75 75)"/>`;
  }
  return `<svg class="bigring" viewBox="0 0 150 150">
    <circle cx="75" cy="75" r="${r}" stroke="#1c232d" stroke-width="10" fill="none"/>
    ${arcs}
    <text x="75" y="76" text-anchor="middle" style="font-size:40px;font-weight:750;fill:var(--tx);letter-spacing:-1.5px">${Math.min(de, total)}</text>
    <text x="75" y="97" text-anchor="middle" style="font-size:11.5px;fill:var(--dim)">of ${total} days</text>
    <text x="75" y="114" text-anchor="middle" style="font-size:10px;fill:#57647a">${endTxt}</text>
  </svg>`;
}

// US Navy tape method, male, cm. ±3-4% real-world error, so 1 decimal only.
function tapeBF(p){
  const h = num(p.heightCm, 0), w = num(p.waistCm, 0), n = num(p.neckCm, 0);
  if (!(h > 0 && w > 0 && n > 0)) return { state: "empty" };
  if (w <= n) return { state: "bad" };
  const bf = Math.round((495 / (1.0324 - 0.19077 * Math.log10(w - n) + 0.15456 * Math.log10(h)) - 450) * 10) / 10;
  return { state: bf >= 3 && bf <= 60 ? "ok" : "off", bf };
}

  const end = parseIso(p.anchor); end.setDate(end.getDate() + total - 1);
  const prog = (now, start, target) => (target === start) ? 1 : clamp((num(now)-num(start)) / (num(target)-num(start)), 0, 1);
  const wp = prog(p.weightNow, p.weightStart, p.weightTarget);

function photoMeta(p){
  const a = parseIso(state.profile.anchor || p.date);
  const dnum = Math.floor((parseIso(p.date) - a) / 864e5) + 1;
  const lastVal = k => {
    const m = [...(state.measurements || [])].filter(x => x.date <= p.date && x[k] != null && !isNaN(num(x[k], NaN)))
      .sort((x, y) => x.date < y.date ? 1 : -1)[0];
    return m ? num(m[k]) : null;
  };
  const w = lastVal("weight"), f = lastVal("fat");
  const parts = [];
  if (w != null) parts.push(`${fmt(w)} kg`);
  if (f != null) parts.push(`${fmt(f)}% fat`);
  return { day: dnum >= 1 ? `Day ${dnum}` : "", sub: parts.join(" &middot; ") };
}

function trendSvg(points, target, color, fromIso, toIso){
  const W = 560, H = 230, L = 38, R = 16, T = 20, B = 34;
  const ys = points.map(p => p.v);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (target != null){ lo = Math.min(lo, target); hi = Math.max(hi, target); }
  if (hi - lo < 1){ lo -= 0.6; hi += 0.6; }
  const span = hi - lo;
  const y0 = lo - span * 0.16, y1 = hi + span * 0.16;
  const x0 = parseIso(fromIso).getTime(), x1 = parseIso(toIso).getTime();
  const px = t => L + (W - L - R) * (x1 === x0 ? 0.5 : (t - x0) / (x1 - x0));
  const py = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const base = H - B;
  const clampX = x => Math.max(L + 24, Math.min(W - R - 24, x));
  const P = points.map(p => [px(parseIso(p.date).getTime()), py(p.v)]);
  let d = P.length ? `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}` : "";
  for (let i = 0; i < P.length - 1; i++){
    const a = P[Math.max(0, i - 1)], b = P[i], c = P[i + 1], e = P[Math.min(P.length - 1, i + 2)];
    d += `C${(b[0] + (c[0] - a[0]) / 6).toFixed(1)},${(b[1] + (c[1] - a[1]) / 6).toFixed(1)} ${(c[0] - (e[0] - b[0]) / 6).toFixed(1)},${(c[1] - (e[1] - b[1]) / 6).toFixed(1)} ${c[0].toFixed(1)},${c[1].toFixed(1)}`;
  }
  const area = P.length > 1 ? `${d} L${P[P.length - 1][0].toFixed(1)},${base} L${P[0][0].toFixed(1)},${base} Z` : "";
  const gx = px(x1), gy = target != null ? py(target) : 0;
  const lastP = P.length ? P[P.length - 1] : null;
  const todayT = parseIso(iso(new Date())).getTime();
  const sel = gSel != null ? points.findIndex(p => p.date === gSel) : -1;
  let tip = "";
  if (sel >= 0){
    const label = `${fmt(points[sel].v)} \u00b7 ${pdate(points[sel].date)}`;
    const tw = label.length * 6.8 + 20;
    const tx = Math.max(L + tw / 2, Math.min(W - R - tw / 2, P[sel][0]));
    const ty = Math.max(P[sel][1] - 38, 4);
    tip = `<g>
      <rect x="${(tx - tw / 2).toFixed(1)}" y="${ty.toFixed(1)}" width="${tw.toFixed(1)}" height="25" rx="9" fill="var(--card2)" stroke="var(--line)"/>
      <text x="${tx.toFixed(1)}" y="${(ty + 17).toFixed(1)}" text-anchor="middle" style="font-size:12.5px;font-weight:650;fill:var(--tx)">${label}</text>
    </g>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".22"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${L}" y1="${py(hi).toFixed(1)}" x2="${W - R}" y2="${py(hi).toFixed(1)}" stroke="#212a35" stroke-width="1" stroke-dasharray="3 6"/>
    <line x1="${L}" y1="${py(lo).toFixed(1)}" x2="${W - R}" y2="${py(lo).toFixed(1)}" stroke="#212a35" stroke-width="1" stroke-dasharray="3 6"/>
    ${todayT > x0 && todayT < x1 ? `<line x1="${px(todayT).toFixed(1)}" y1="${T}" x2="${px(todayT).toFixed(1)}" y2="${base}" stroke="#3a4656" stroke-width="1" stroke-dasharray="2 5"/>` : ""}
    <text x="${L - 7}" y="${(py(hi) + 4).toFixed(1)}" text-anchor="end" style="font-size:11px;fill:var(--dim)">${fmt(hi)}</text>
    <text x="${L - 7}" y="${(py(lo) + 4).toFixed(1)}" text-anchor="end" style="font-size:11px;fill:var(--dim)">${fmt(lo)}</text>
    ${area ? `<path d="${area}" fill="url(#tg)"/>` : ""}
    ${target != null && lastP ? `<line x1="${lastP[0].toFixed(1)}" y1="${lastP[1].toFixed(1)}" x2="${gx.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="${color}" stroke-width="1.5" stroke-dasharray="2 6" opacity=".5"/>` : ""}
    ${P.length > 1 ? `<path d="${d}" fill="none" stroke="${color}" stroke-width="7" opacity=".15" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${points.map((p, i) => {
      const x = P[i][0].toFixed(1), y = P[i][1].toFixed(1);
      return `${gSel === p.date ? `<circle cx="${x}" cy="${y}" r="8" fill="none" stroke="${color}" stroke-width="1.5" opacity=".55"/>` : ""}
      <circle cx="${x}" cy="${y}" r="3.6" fill="${color}" stroke="var(--bg)" stroke-width="1.6"/>
      <circle cx="${x}" cy="${y}" r="15" fill="transparent" class="tap" data-act="gpt" data-d="${p.date}"/>`;
    }).join("")}
    ${target != null ? `<circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="4.5" fill="var(--bg)" stroke="${color}" stroke-width="2.5"/>
      <text x="${clampX(gx).toFixed(1)}" y="${Math.max(gy - 11, 12).toFixed(1)}" text-anchor="middle" style="font-size:13.5px;font-weight:750;fill:${color}">${fmt(target)}</text>` : ""}
    ${tip}
    <line x1="${L}" y1="${base}" x2="${W - R}" y2="${base}" stroke="#2b3544" stroke-width="1.5"/>
    ${[0, 0.25, 0.5, 0.75, 1].map(f => {
      const x = L + (W - L - R) * f;
      const dd = new Date(x0 + (x1 - x0) * f);
      return `<line x1="${x.toFixed(1)}" y1="${base}" x2="${x.toFixed(1)}" y2="${base + 4}" stroke="#2b3544" stroke-width="1.5"/>
        <text x="${x.toFixed(1)}" y="${H - 9}" text-anchor="${f === 0 ? "start" : f === 1 ? "end" : "middle"}" style="font-size:11px;fill:var(--dim)">${pdate(iso(dd))}</text>`;
    }).join("")}
  </svg>`;
}

// reverse a cheat-filled meal slot: drop the link and un-log that cheat pick
function unXmeal(mid){
  const link = (state.nutrition.xmeal[sel] || {})[mid];
  if (!link) return;
  delete state.nutrition.xmeal[sel][mid];
  if (link.t){   // v140 link: remove the matching entry from the type log
    const list = ((state.nutrition.tlog[sel] || {})[link.t]) || [];
    for (let i = list.length - 1; i >= 0; i--) if (list[i].slot === mid){ list.splice(i, 1); break; }
    return;
  }
  const lg = state.nutrition.exlog[sel] || {};
  if (lg[link.x]){ lg[link.x]--; if (!lg[link.x]) delete lg[link.x]; }
  const pk = (state.nutrition.xpicks[sel] || {})[link.x];
  if (pk){ const i = pk.lastIndexOf(link.label); if (i >= 0) pk.splice(i, 1); }
}

// current weight/fat = the latest log that has that metric
function syncNow(){
  ["weight", "fat"].forEach(k => {
    const withK = (state.measurements || []).filter(m => m[k] != null && !isNaN(num(m[k], NaN)))
      .sort((a, b) => a.date < b.date ? -1 : 1);
    if (withK.length) state.profile[k === "weight" ? "weightNow" : "fatNow"] = num(withK[withK.length - 1][k]);

}

/* ---------- progress photos: stored in IndexedDB (localStorage is too small for images) ---------- */
let photos = [];                                  // { id, date, url } newest first, in-memory mirror
function ptx(mode, fn){
  return new Promise((res, rej) => {
    const q = indexedDB.open("workout.photos", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("photos", { keyPath: "id" });
    q.onerror = () => rej(q.error);
    q.onsuccess = () => {
      const db = q.result, t = db.transaction("photos", mode);
      const out = fn(t.objectStore("photos"));
      t.oncomplete = () => { db.close(); res(out && out.result); };
      t.onerror = () => { db.close(); rej(t.error); };
    };
  });
}
function loadPhotos(){
  return ptx("readonly", st => st.getAll()).then(rows => {
    photos = (rows || []).sort((a, b) => (b.ts || 0) - (a.ts || 0))
      .map(r => ({ id: r.id, date: r.date, url: URL.createObjectURL(r.blob) }));
  }).catch(() => {});
}
function addPhoto(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(blob => {
        if (!blob) return res();
        const rec = { id: uid(), date: iso(new Date()), ts: Date.now(), blob };
        ptx("readwrite", st => st.put(rec)).then(() => {
          photos.unshift({ id: rec.id, date: rec.date, url: URL.createObjectURL(blob) });
          res();
        }).catch(res);
      }, "image/jpeg", 0.85);
    };
    img.onerror = () => res();
    img.src = URL.createObjectURL(file);
  });
}
function delPhoto(id){
  return ptx("readwrite", st => st.delete(id)).then(() => {
    const p = photos.find(x => x.id === id);
    if (p) URL.revokeObjectURL(p.url);
    photos = photos.filter(x => x.id !== id);
  }).catch(() => {});
}
const pdate = (d, long) => parseIso(d).toLocaleDateString(undefined,

function weekCount(exId, dateIso){
  const mon = mondayOf(parseIso(dateIso || sel));
  let n = 0;
  for (let i = 0; i < 7; i++){
    const d = new Date(mon); d.setDate(d.getDate() + i);
    n += (state.nutrition.exlog[iso(d)] || {})[exId] || 0;
  }
  return n;
}

function weekPicks(exId){
  const mon = mondayOf(parseIso(sel));
  const out = [];
  for (let i = 0; i < 7; i++){
    const d = new Date(mon); d.setDate(d.getDate() + i);
    out.push(...(((state.nutrition.xpicks)[iso(d)] || {})[exId] || []));
  }
  return out;
}

/* ---------- daily snapshots: each day is judged by the plan that was in effect that day ---------- */
const snapEx = e => {
  const r = resolve(e);
  return { id: e.id, name: e.name, t: r.time ? `${fmt(r.mins)} min` : `${r.sets} &times; ${fmt(r.reps)}${r.weight ? ` @ ${fmt(r.weight)} kg` : ""}` };
};
const snapWk = (w, ds) => {
  const eff = effOf(w, ds);
  return { id: w.id, title: eff.title, icon: iconOfW(eff), exs: unitsOf(eff).map(snapEx) };
};
function daySnap(ds){
  const di = dayIdx(parseIso(ds));
  return {
    w: workoutsFor(ds).map(w => snapWk(w, ds)),
    habits: state.nutrition.rules.map(r => ({ id: r.id, name: r.name, kind: r.kind, target: r.target, unit: r.unit, xper: r.xper })),
    menu: state.nutrition.menu.filter(m => !m.days || m.days.includes(di)).map(m => ({ id: m.id, mtype: m.mtype })),
    cheats: state.xtypes.map(t => ({ t: t.id, name: t.name, limit: num(t.limit, 0), xper: t.xper, replaces: t.replaces }))
  };
}
function snapDays(){
  state.snaps = state.snaps || {};
  const today = iso(new Date());
  const start = parseIso(state.profile.anchor || today);
  if (!isNaN(start)) for (let d = new Date(start), i = 0; iso(d) < today && i < 400; d.setDate(d.getDate() + 1), i++){
    if (!state.snaps[iso(d)]) state.snaps[iso(d)] = daySnap(iso(d));   // missed day: freeze with the config we have now
  }
  state.snaps[today] = daySnap(today);                                 // today always mirrors the current config
  const cut = new Date(); cut.setDate(cut.getDate() - 400);
  const cutIso = iso(cut);
  for (const k in state.snaps) if (k < cutIso) delete state.snaps[k];
}
const snapOf = ds => ds < iso(new Date()) ? (state.snaps || {})[ds] : null;
function resnapWorkout(ds, wid){
  const s = (state.snaps || {})[ds]; if (!s) return;
  const w = state.workouts.find(x => x.id === wid); if (!w) return;
  const i = s.w.findIndex(x => x.id === wid);
  if (i >= 0) s.w[i] = snapWk(w, ds); else s.w.push(snapWk(w, ds));
}

// a cheat's limit applies per its period: day | week (default) | month
function periodCount(x, dateIso){
  const per = x.xper || "week";
  const d = dateIso || sel;
  if (per === "day") return (state.nutrition.exlog[d] || {})[x.id] || 0;
  if (per === "month"){
    const pre = d.slice(0, 7);
    let n = 0;
    for (const k in state.nutrition.exlog) if (k.slice(0, 7) === pre) n += state.nutrition.exlog[k][x.id] || 0;
    return n;
  }
  return weekCount(x.id, d);
}
const perWord = x => (x.xper || "week") === "day" ? "today" : (x.xper === "month" ? "this month" : "this week");
const weekOkFor = ds => {
  const sn = snapOf(ds);
  const cs = sn ? (sn.cheats || []) : state.xtypes.map(t => ({ t: t.id, limit: num(t.limit, 0), xper: t.xper }));
  return cs.every(c => c.t
    ? typePoints(c.t, ds, c.xper) <= num(c.limit, 0)
    : periodCount(c, ds) <= num(c.limit, 0));   // pre-v140 snapshot: per-cheat limits over exlog
};

function habitPeriodCount(h, ds){
  const per = h.xper || "day";
  if (per === "day") return num((state.nutrition.logs[ds] || {})[h.id], 0);
  if (per === "month"){
    const pre = ds.slice(0, 7);
    let n = 0;
    for (const k in state.nutrition.logs) if (k.slice(0, 7) === pre) n += num(state.nutrition.logs[k][h.id], 0);
    return n;
  }
  const mon = mondayOf(parseIso(ds));
  let n = 0;
  for (let i = 0; i < 7; i++){
    const d = new Date(mon); d.setDate(d.getDate() + i);
    n += num((state.nutrition.logs[iso(d)] || {})[h.id], 0);
  }
  return n;
}
function habitDone(h, ds){
  const v = (state.nutrition.logs[ds] || {})[h.id];
  if (h.kind === "limit") return habitPeriodCount(h, ds) <= num(h.target, 0);
  return h.kind === "count" ? num(v, 0) >= num(h.target, 1) : !!v;
}

function dayFlags(ds){
  const s = snapOf(ds);
  const exIds = s ? s.w.flatMap(w => w.exs.map(e => e.id)) : exercisesFor(ds).map(e => e.id);
  const wPlanned = exIds.length > 0;
  const wOk = !wPlanned || exIds.every(id => exDone(ds, { id }));
  const habs = s ? s.habits : state.nutrition.rules;
  const nTracked = habs.length > 0;
  const nOk = !nTracked || (habs.every(h => habitDone(h, ds)) && weekOkFor(ds) && !num((state.nutrition.xnoslot || {})[ds], 0));
  return { wPlanned, wOk, nTracked, nOk };
}

function daysDone(kind){
  let n = 0;
  const start = parseIso(state.profile.anchor);
  const today = startOfDay(new Date());
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)){
    const f = dayFlags(iso(d));
    if (kind === "w" ? (f.wPlanned && f.wOk) : (f.nTracked && f.nOk)) n++;
  }
  return n;
}

// food amounts are stored as one string ("200 g") but edited as number + unit dropdown
const parseAmt = amt => {
  const mm = String(amt || "").trim().match(/^([\d.,]*)\s*(.*)$/);
  return { qty: (mm[1] || "").trim(), unit: (mm[2] || "").trim() || "g" };
};

const UNITS = ["g", "pcs", "ml"];
const MTYPES = ["breakfast", "lunch", "dinner", "snack"];
const cap1 = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const mtypeOf = m => m.mtype || "snack";

const mLabel = m => m.mtype ? cap1(m.mtype) : (m.name || cap1(mtypeOf(m)));
const foodRow = (it, acts) => {
  const p = parseAmt(it.amt);
  const units = [...UNITS]; if (p.unit && !units.includes(p.unit)) units.push(p.unit);
  return `<div class="row" style="margin-top:8px;gap:6px" ${acts.drag ? `data-drag-row data-id="${acts.i}"` : ""}>
    ${acts.drag ? `<span class="dragh" data-drag="${acts.drag}" style="padding:8px 4px 8px 0">&#8801;</span>` : ""}
    <input class="grow" data-act="${acts.name}" ${acts.data} value="${esc(it.name)}">
    <input style="width:64px;flex:none;text-align:center" inputmode="decimal" placeholder="200" data-act="${acts.qty}" ${acts.data} value="${esc(p.qty)}">
    <select style="width:80px;flex:none" data-act="${acts.unit}" ${acts.data}>
      ${units.map(u => `<option value="${esc(u)}" ${u === p.unit ? "selected" : ""}>${esc(u)}</option>`).join("")}
    </select>
    ${delBtn(acts.del, acts.key, acts.data)}
  </div>`;
};
// every destructive control is tap-twice: first tap arms, second deletes
const delBtn = (act, key, data) => armed === `${act}:${key}`
  ? `<button class="ghost sm" data-act="${act}" ${data} style="color:var(--bad);border-color:rgba(255,95,87,.35);flex:none;padding:8px 12px;font-size:13px">Tap again</button>`
  : `<button class="x" data-act="${act}" ${data} title="Remove">&times;</button>`;
const amtLabel = it => esc(it.name) + (it.amt ? ` &middot; ${esc(it.amt)}` : "");
// a cheat has no title: it IS its type (legacy cheats may still carry a name)
// meal/snack cheats replace a free menu slot: meal -> lunch/dinner, snack -> snack.
// undefined = not slot-bound (custom type); null = slot-bound but nothing free.
// a meal/snack type fills a free menu slot: meal -> lunch/dinner, snack -> snack.
// undefined = the type replaces nothing; null = slot-bound but nothing free.
function freeSlotForType(t, ds){
  if (t.replaces !== "meal" && t.replaces !== "snack") return undefined;
  const d = ds || sel;
  const sn = snapOf(d);
  const di2 = dayIdx(parseIso(d));
  const mm = sn ? sn.menu : state.nutrition.menu.filter(m => !m.days || m.days.includes(di2));
  const l2 = state.nutrition.logs[d] || {};
  const want = t.replaces === "snack" ? ["snack"] : ["lunch", "dinner"];
  return mm.find(m => want.includes(m.mtype || "snack") && !l2[m.id]) || null;
}
// one cheat use: the option's cost lands on the TYPE's budget; a meal/snack type fills the
// given slot (mid) or the first free one, else the use voids the day (entry.ns -> xnoslot)
function logType(t, x, mid){
  const label = x.name + (x.amt ? ` \u00b7 ${x.amt}` : "");
  const entry = { x: x.id, label, cost: +x.cost || 1, slot: null };
  if (mid) entry.slot = mid;
  else if (t.replaces){
    const slot = freeSlotForType(t);
    if (slot) entry.slot = slot.id;
    else {
      entry.ns = true;
      const ns = state.nutrition.xnoslot = state.nutrition.xnoslot || {};
      ns[sel] = (ns[sel] || 0) + 1;
    }
  }
  if (entry.slot){
    (state.nutrition.xmeal[sel] = state.nutrition.xmeal[sel] || {})[entry.slot] = { x: x.id, label, t: t.id };
    (state.nutrition.logs[sel] = state.nutrition.logs[sel] || {})[entry.slot] = true;
  }
  const tl = state.nutrition.tlog[sel] || (state.nutrition.tlog[sel] = {});
  (tl[t.id] = tl[t.id] || []).push(entry);
}
// points a type has spent in its period window
function typePoints(tid, ds, xper){
  const per = xper || (state.xtypes.find(t => t.id === tid) || {}).xper || "week";
  const sum = d => (((state.nutrition.tlog || {})[d] || {})[tid] || []).reduce((s2, e) => s2 + (+e.cost || 1), 0);
  if (per === "day") return sum(ds);
  if (per === "month"){
    const pre = ds.slice(0, 7);
    let n = 0;
    for (const k in state.nutrition.tlog) if (k.slice(0, 7) === pre) n += sum(k);
    return n;
  }
  const mon = mondayOf(parseIso(ds));
  let n = 0;
  for (let i = 0; i < 7; i++){ const d = new Date(mon); d.setDate(d.getDate() + i); n += sum(iso(d)); }
  return n;
}

    const hrow = h => {
      if (h.kind === "limit"){
        const t = num(h.target, 0), c = habitPeriodCount(h, sel), over = c > t;
        const pw = h.xper === "month" ? "this month" : h.xper === "week" ? "this week" : "today";
        return `<div class="ex between">
          <div class="grow tap" data-act="hplus" data-r="${h.id}">
            <div class="name">${esc(h.name)}</div>
            <div class="target" style="${over ? "color:var(--bad)" : ""}">${c}/${fmt(t)}${h.unit ? ` ${esc(h.unit)}` : ""} ${pw}${over ? " &middot; over limit" : ""}</div>
          </div>
          <div class="row" style="gap:4px">
            <button class="x" data-act="hminus" data-r="${h.id}" title="Undo one">&minus;</button>
            <button class="tap" style="background:none;border:0;padding:0" data-act="hplus" data-r="${h.id}">${xring(c, t, over ? "var(--bad)" : "var(--warm)")}</button>
          </div>
        </div>`;
      }
      if (h.kind === "count"){
        const t = num(h.target, 1), c = num(l[h.id], 0), on = c >= t;
        return `<div class="ex between">
          <div class="grow tap" data-act="hplus" data-r="${h.id}">
            <div class="name" style="${on ? "color:var(--dim);text-decoration:line-through" : ""}">${esc(h.name)}</div>
            <div class="target">${c}/${fmt(t)}${h.unit ? ` ${esc(h.unit)}` : ""}</div>
          </div>
          <div class="row" style="gap:4px">
            <button class="x" data-act="hminus" data-r="${h.id}" title="Undo one">&minus;</button>
            <button class="tap" style="background:none;border:0;padding:0" data-act="hplus" data-r="${h.id}">${xring(c, t, "var(--acc)")}</button>
          </div>
        </div>`;
      }
      return `<div class="ex between tap" data-act="ndone" data-r="${h.id}">
        <div class="grow"><div class="name" style="${l[h.id] ? "color:var(--dim);text-decoration:line-through" : ""}">${esc(h.name)}</div></div>
        <div class="chk ${l[h.id] ? "on" : ""}">&#10003;</div>
      </div>`;
    };
    html += `<div class="card">
      <div class="chead">
        ${secTitle("habits", "Habits", hl.length > 0 && hdone >= hl.length)}
        ${hl.length ? ring(hdone / hl.length) : ""}
      </div>
      ${hl.map(hrow).join("")}
      ${hl.length ? "" : `<div class="tiny" style="margin:12px 0 10px">No habits yet &mdash; start with a preset:</div>${presets}`}
    </div>`;
  }

  let shownMenu = menu;
  if (editN && editN !== true){
    const em = state.nutrition.menu.find(m => m.id === editN);
    if (em && !shownMenu.includes(em)) shownMenu = [...shownMenu, em];
  }
  const mopts = state.nutrition.mopts[sel] || {};
  const mrow = m => {
    const link = (state.nutrition.xmeal[sel] || {})[m.id];
    const pickId = mopts[m.id];
    const chosenObj = pickId ? state.nutrition.menu.find(o => o.id === pickId && o.id !== m.id) : null;
    const title = mLabel(m);
    const foodsList = chosenObj ? (chosenObj.items || []) : (m.items || []);
    const foods = link
      ? `<div class="target"><div>&bull;&nbsp; ${link.label}</div></div>`
      : foodsList.length
        ? `<div class="target">${foodsList.map(it => `<div>&bull;&nbsp; ${esc(it.name)}${it.amt ? ` &middot; ${esc(it.amt)}` : ""}</div>`).join("")}</div>` : "";
    const canChoose = state.nutrition.menu.some(o => o.id !== m.id && mtypeOf(o) === mtypeOf(m)) || state.nutrition.exclusions.length > 0;
    return `<div class="ex between">
      <div class="grow tap" data-act="${canChoose ? "nmchoose" : "ndone"}" data-m="${m.id}" data-r="${m.id}">
        <div class="name" style="${l[m.id] ? "color:var(--dim);text-decoration:line-through" : ""}">${title}</div>
        ${foods}
      </div>
      <div class="chk ${l[m.id] ? "on" : ""}" data-act="ndone" data-r="${m.id}">&#10003;</div>
    </div>`;
  };
  html += `<div class="card">
    <div class="chead">
      ${secTitle("menu", "Menu", menu.length > 0 && mdone >= menu.length)}
      ${menu.length ? ring(mdone / menu.length) : ""}
    </div>
    ${shownMenu.map(m => editN === m.id ? mEdit(m) : mrow(m)).join("") || `<div class="muted" style="margin-top:10px">No menu items for this day.</div>`}
  </div>`;

  if (xts.length || xlegacy.length){
    const trow = t => {
      const pts = typePoints(t.t, sel, t.xper), lim = num(t.limit, 0), over = pts > lim;
      const picks = ((state.nutrition.tlog[sel] || {})[t.t]) || [];
      return `<div class="ex between">
        <div class="grow tap" data-act="xtchoose" data-t="${t.t}">
          <div class="name" style="${picks.length ? "color:var(--dim);text-decoration:line-through" : ""}">${esc(t.name)}</div>
          <div class="target" style="${over ? "color:var(--bad)" : ""}">${fmt(pts)}/${fmt(lim)} ${perWord(t)}${over ? " &middot; over limit" : ""}</div>
          ${t.replaces && freeSlotForType(t) === null && pts < lim ? `<div class="target" style="color:var(--warm)">No free ${t.replaces} slot &mdash; logging voids the day</div>` : ""}
          ${picks.length ? `<div class="target">${picks.reduce((gs, e) => {
            const g = gs.find(y => y.t === e.label);
            if (g) g.n++; else gs.push({ t: e.label, n: 1 });
            return gs;
          }, []).map(g => `<div>&bull;&nbsp; ${esc(g.t)} (${g.n})</div>`).join("")}</div>` : ""}
        </div>
        <div class="row" style="gap:4px">
          <button class="x" data-act="xtminus" data-t="${t.t}" title="Undo one">&minus;</button>
          <button class="tap" style="background:none;border:0;padding:0" data-act="xtplus" data-t="${t.t}">${xring(pts, lim, over ? "var(--bad)" : "var(--warm)")}</button>
        </div>
      </div>`;
    };
    // pre-v140 snapshot days: display-only rows from the old per-cheat log
    const lrow = x => {
      const c = periodCount(x, sel), over = c > num(x.limit, 0);
      const todays = ((state.nutrition.xpicks[sel] || {})[x.id]) || [];
      return `<div class="ex between">
        <div class="grow">
          <div class="name">${esc(x.name)}</div>
          <div class="target" style="${over ? "color:var(--bad)" : ""}">${c}/${fmt(num(x.limit, 0))} ${perWord(x)}${over ? " &middot; over limit" : ""}</div>
          ${todays.length ? `<div class="target">${todays.map(g => `<div>&bull;&nbsp; ${esc(g)}</div>`).join("")}</div>` : ""}
        </div>
      </div>`;
    };
    const xused = xts.reduce((s2, t) => s2 + typePoints(t.t, sel, t.xper), 0);
    const xcap = xts.reduce((s2, t) => s2 + num(t.limit, 0), 0);
    const xover = xts.some(t => typePoints(t.t, sel, t.xper) > num(t.limit, 0));
    html += `<div class="card">
      <div class="chead">${secTitle("limits", "Cheats")}${ring(xcap ? Math.min(xused / xcap, 1) : 0, xover ? "var(--bad)" : "var(--warm)")}</div>
      ${num((state.nutrition.xnoslot || {})[sel], 0) ? `<div class="target" style="color:var(--bad);margin:2px 0 6px">Cheat used with no free slot &mdash; this day is not counted</div>` : ""}
      ${xts.map(trow).join("")}${xlegacy.map(lrow).join("")}
    </div>`;
  }

  return html;
}

/* ---------- shell ---------- */
const TABS = [
  { id:"home",      label:"Home",      icon:'<path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/>' },
  { id:"workout",   label:"Workout",   icon:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/>' },
  { id:"nutrition", label:"Nutrition", icon:'<path d="M15 3c-1.8 0-3 1.4-3 3"/><path d="M12 6c-4-1.8-8 1-8 6 0 4 3 9 6 9 1 0 1.3-.6 2-.6s1 .6 2 .6c3 0 6-5 6-9 0-5-4-7.8-8-6z"/>' },
  { id:"photos",    label:"Progress",  icon:'<path d="m3 17 6-6 4 4 8-8"/><path d="M14.5 7H21v6.5"/>' }
];
const VIEWS = { home:viewHome, workout:viewWorkout, nutrition:viewNutrition, photos:viewPhotos };
const HEAD = {
  home:      () => ({ t: "Home", s: "" }),
  workout:   () => ({ t: sel === iso(new Date()) ? "Today" : DAYS[dayIdx(parseIso(sel))-1], s: "" }),
  nutrition: () => ({ t: "Nutrition", s: "" }),
  photos:    () => ({ t: "Progress", s: "" })
};

function render(){
  const h = HEAD[tab]();
  const title = document.getElementById("hTitle");
  if (tab === "home"){
    const modeLabel = { bulk:"Bulk", cut:"Cut", maintain:"Maintain" }[state.profile.mode] || state.profile.mode;
    title.innerHTML = `<span class="badge big ${esc(state.profile.mode)}">${esc(modeLabel)}</span>`;
  } else {
    title.textContent = h.t;
  }
  const sub = document.getElementById("hSub");
  sub.textContent = h.s; sub.style.display = h.s ? "" : "none";
  const pencil = (act, on) => `<button class="iconbtn ${on ? "on" : ""}" data-act="${act}" title="Edit">
    <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>`;
  document.getElementById("hRight").innerHTML =
    tab === "workout" ? pencil("edit", editing)
    : tab === "nutrition" ? pencil("editn", editN)
    : tab === "home" ? pencil("edittgt", editTargets)
    : "";
  const pcar0 = document.querySelector("#view .pcar");
  const pscroll = pcar0 ? pcar0.scrollLeft : null;
  document.getElementById("view").innerHTML = VIEWS[tab]();
  const pcar1 = document.querySelector("#view .pcar");
  if (pcar1){
    if (pscroll != null) pcar1.scrollLeft = pscroll;
    pcar1.onscroll = () => {
      const first = pcar1.firstElementChild;
      const w = first ? first.getBoundingClientRect().width + 12 : 1;
      const i = Math.max(0, Math.min(photos.length - 1, Math.round(pcar1.scrollLeft / w)));
      const dots = document.getElementById("pdots");
      if (dots) [...dots.children].forEach((d, j) => d.classList.toggle("on", j === i));
      const cnt = document.getElementById("pcount");
      if (cnt) cnt.textContent = `${i + 1} / ${photos.length}`;
    };
    pcar1.onscroll();
  }
  const sroot = document.getElementById("sheetRoot");
  if (sheet){
    let title = "", content = "", foot = `<button data-act="shcancel">Close</button>`;
    if (sheet.kind === "pick"){
      const m = state.nutrition.menu.find(x => x.id === sheet.mid) || { name: "", alts: [] };
      const cur = (state.nutrition.mopts[sel] || {})[m.id] || "";
      title = `Choose ${mLabel(m)}`;
      const itemsLbl = list => (list || []).map(amtLabel).join(" &middot; ");
      const optRow = (id, label, sub, on) => `<div class="opt ${on ? "on" : ""} tap" data-act="pickopt" data-id="${id}">
          <div class="grow"><div class="oname">${label}</div>${sub ? `<div class="target" style="margin-top:2px">${sub}</div>` : ""}</div>
          <div class="ck">&#10003;</div>
        </div>`;
      const own = optRow("", itemsLbl(m.items) || mLabel(m), "", cur === "");
      // other menu items of the same type (swap the whole slot, e.g. Wednesday's lunch on a Tuesday)
      const others = state.nutrition.menu
        .filter(o => o.id !== m.id && mtypeOf(o) === mtypeOf(m))
        .map(o => optRow(o.id, itemsLbl(o.items) || mLabel(o), "", cur === o.id)).join("");
      const wantCat = mtypeOf(m) === "snack" ? "snack" : (mtypeOf(m) === "lunch" || mtypeOf(m) === "dinner") ? "meal" : "none";
      const cheats = state.xtypes.filter(t2 => t2.replaces === wantCat).flatMap(t2 =>
        state.nutrition.exclusions.filter(x => x.xt === t2.id).map(x =>
          `<div class="opt tap" data-act="xmeal" data-m="${m.id}" data-x="${x.id}">
            <div class="grow"><div class="oname">${amtLabel(x)}</div>
              <div class="target" style="margin-top:2px">${esc(t2.name)} &middot; ${fmt(num(x.cost, 1))} pt${num(x.cost, 1) === 1 ? "" : "s"}</div></div>
            <div class="ck" style="color:var(--dim)">&#43;</div>
          </div>`)).join("");
      content = own + (others ? `<div class="tiny" style="margin:12px 0 2px">Other ${mtypeOf(m) === "lunch" ? "lunches" : esc(mtypeOf(m)) + "s"}</div>${others}` : "")
        + (cheats ? `<div class="tiny" style="margin:12px 0 2px">Cheat instead</div>${cheats}` : "");
      foot = `<button data-act="shcancel">Cancel</button>`;
    } else if (sheet.kind === "xpick"){
      const t2 = state.xtypes.find(z => z.id === sheet.t) || { name: "" };
      title = `Choose ${esc(t2.name)}`;
      content = state.nutrition.exclusions.filter(x => x.xt === sheet.t).map(x =>
        `<div class="opt tap" data-act="xpickopt" data-x="${x.id}">
          <div class="grow"><div class="oname">${amtLabel(x)}</div>
            <div class="target" style="margin-top:2px">${fmt(num(x.cost, 1))} pt${num(x.cost, 1) === 1 ? "" : "s"}</div></div>
          <div class="ck" style="color:var(--dim)">&#43;</div>
        </div>`).join("");
      foot = `<button data-act="shcancel">Cancel</button>`;
    } else if (sheet.kind === "wpick"){
      const w = state.workouts.find(x => x.id === sheet.wid) || {};
      const curId = (state.wopts[sel] || {})[w.id] || w.id;
      title = `Choose ${esc(w.title || "")}`;
      const wRow = (o, showType) => {
        let summ = o.type === "activity" ? `${fmt(num(o.mins, 0))} min` : `${(o.exercises || []).length} exercise${(o.exercises || []).length === 1 ? "" : "s"}`;
        if (showType) summ = `${esc(cap1(wtypeOfW(o)))} &middot; ${summ}`;
        return `<div class="opt ${curId === o.id ? "on" : ""} tap" data-act="wpickopt" data-id="${o.id}">
          <div class="grow"><div class="oname">${esc(o.title)}</div><div class="target" style="margin-top:2px">${summ}</div></div>
          <div class="ck">&#10003;</div>
        </div>`;
      };
      const others = state.workouts.filter(o => o.id !== w.id && wtypeOfW(o) === wtypeOfW(w));
      const rest = state.workouts.filter(o => o.id !== w.id && wtypeOfW(o) !== wtypeOfW(w));
      content = wRow(w)
        + (others.length ? `<div class="tiny" style="margin:12px 0 2px">Other ${esc(wtypeOfW(w))} workouts</div>${others.map(o => wRow(o)).join("")}` : "")
        + (rest.length ? `<div class="tiny" style="margin:12px 0 2px">Other types</div>${rest.map(o => wRow(o, true)).join("")}` : "");
      foot = `<button data-act="shcancel">Cancel</button>`;
    } else if (sheet.kind === "photo"){
      const p = photos.find(x => x.id === sheet.pid);
      title = p ? pdate(p.date, true) : "Photo";
      content = p ? `<img src="${p.url}" style="width:100%;border-radius:14px;display:block">` : "";
      foot = `<button class="ghost" data-act="pdel" data-p="${sheet.pid}" style="color:var(--bad)">${armed === "pdel:" + sheet.pid ? "Tap again to delete" : "Delete"}</button>
        <button class="pri" data-act="shcancel">Close</button>`;
    }
    sroot.innerHTML = `<div class="overlay" data-act="shcancel"></div>
      <div class="sheet${sheetNew ? "" : " noanim"}">
        <div class="shead">${title}</div>
        <div class="sbody">${content}</div>
        <div class="sfoot">${foot}</div>
      </div>`;
    document.body.style.overflow = "hidden";
    sheetNew = false;
  } else {
    sroot.innerHTML = "";
    document.body.style.overflow = "";
  }
  const editAct = tab === "workout" && editing ? "edit"
    : tab === "nutrition" && editN ? "editn"
    : tab === "home" && editTargets ? "edittgt" : null;
  document.getElementById("fabRoot").innerHTML = editAct && !sheet
    ? `<button class="fab" data-act="${editAct}">Done</button>` : "";
  document.getElementById("nav").innerHTML = TABS.map(t =>
    `<button class="${t.id===tab?"on":""}" data-act="tab" data-tab="${t.id}">
      <svg viewBox="0 0 24 24">${t.icon}</svg>${t.label}</button>`).join("");
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  const ARMED_ACTS = ["nreset", "delwk", "pdel", "nmdel", "ndel", "xdel", "delex", "nmidel", "xtdel", "gldel", "npresetdel", "delrule"];
  if (armed && !ARMED_ACTS.includes(a)) armed = null;

  if (a === "gmetric"){ gMetric = el.dataset.t; gAdd = false; gSel = null; gEdit = null; render(); return; }
  if (a === "gpt"){ gSel = gSel === el.dataset.d ? null : el.dataset.d; render(); return; }
  if (a === "gledit"){ gEdit = el.dataset.d; gAdd = false; render(); return; }
  if (a === "glupd"){
    const nd = (document.getElementById("gedate") || {}).value;
    const nv = num((document.getElementById("geval") || {}).value, NaN);
    if (!nd || isNaN(nv)) return;
    const src = state.measurements.find(x => x.date === gEdit);
    if (src){
      if (nd === gEdit) src[gMetric] = nv;
      else {
        delete src[gMetric];
        const other = gMetric === "weight" ? "fat" : "weight";
        if (src[other] == null) state.measurements = state.measurements.filter(x => x !== src);
        let dst = state.measurements.find(x => x.date === nd);
        if (!dst){ dst = { date: nd }; state.measurements.push(dst); }
        dst[gMetric] = nv;
      }
      syncNow();
    }
    gEdit = null; gSel = null; save(); render(); return;
  }
  if (a === "gldel"){
    const k = "gldel:" + (gEdit);
    if (armed !== k){ armed = k; render(); return; }
    armed = null;
    const m = state.measurements.find(x => x.date === gEdit);
    if (m){
      delete m[gMetric];
      const other = gMetric === "weight" ? "fat" : "weight";
      if (m[other] == null) state.measurements = state.measurements.filter(x => x !== m);
      syncNow();
    }
    gEdit = null; gSel = null; save(); render(); return;
  }
  if (a === "gladd"){ gAdd = true; render(); return; }
  if (a === "glcancel"){ gAdd = false; render(); return; }
  if (a === "glsave"){
    const d = (document.getElementById("gldate") || {}).value;
    const v = num((document.getElementById("glval") || {}).value, NaN);
    if (!d || isNaN(v)) return;
    const ms = state.measurements;
    let m = ms.find(x => x.date === d);
    if (!m){ m = { date: d }; ms.push(m); }   // only the logged metric — never fabricate the other one
    m[gMetric] = v;
    syncNow();
    gAdd = false; save(); render(); return;
  }
  if (a === "paddphoto"){ const f = document.querySelector('input[data-act="pfile"]'); if (f) f.click(); return; }
  if (a === "popen"){ sheetNew = true; sheet = { kind: "photo", pid: el.dataset.p }; render(); return; }
  if (a === "pdel"){
    const id = el.dataset.p;
    if (armed !== "pdel:" + id){ armed = "pdel:" + id; render(); return; }
    armed = null;
    delPhoto(id).then(() => { sheet = null; render(); });
    return;
  }

  if (a === "tab"){ tab = el.dataset.tab; editing = false; editTargets = false; editN = false; showRules = false; wtAdd = null; wkOpen = null; sheet = null; render(); window.scrollTo(0,0); return; }
  if (a === "rulestoggle"){ showRules = !showRules; render(); return; }
  if (a === "pick"){ sel = el.dataset.date; editing = false; sheet = null; render(); return; }
  if (a === "shcancel"){ sheet = null; exOpen = null; render(); return; }
  if (a === "wshift"){ weekOffset += +el.dataset.d; render(); return; }
  if (a === "edit"){ editing = editing ? false : true; exOpen = null; wkOpen = null; render(); return; }
  if (a === "wkopen"){
    if (wkOpen === el.dataset.w){ wkOpen = null; wkHome = null; }
    else { const w2 = state.workouts.find(x => x.id === el.dataset.w); wkOpen = el.dataset.w; wkHome = w2 ? wkSec(w2) : null; }
    exOpen = null; render(); return; }
  if (a === "exopen"){
    if (exOpen === el.dataset.ex){ exOpen = null; exHome = null; }
    else { exOpen = el.dataset.ex;
      const m2 = state.nutrition.menu.find(x => x.id === exOpen);
      exHome = m2 ? mSec(m2) : null; }
    render(); return; }
  if (a === "addwk"){
    const nw = { id: uid(), title: "New workout", exercises: [], wtype: "strength", days: [dayIdx(parseIso(sel))] };
    syncWMode(nw);
    state.workouts.push(nw); wkOpen = nw.id; wkHome = "today"; exOpen = null;
    save(); render(); return;
  }
  if (a === "wchoose"){
    sheetNew = true;
    sheet = { kind: "wpick", wid: el.dataset.w };
    render(); return;
  }
  if (a === "wpickopt"){
    if (!sheet || sheet.kind !== "wpick") return;
    const wid = sheet.wid;
    const wo = state.wopts[sel] || (state.wopts[sel] = {});
    if (el.dataset.id === wid) delete wo[wid]; else wo[wid] = el.dataset.id;
    resnapWorkout(sel, wid);
    sheet = null; save(); render(); return;
  }
  if (a === "wkwtype"){
    const w = findWk(el.dataset.w); if (!w) return;
    w.wtype = el.dataset.t;
    save(); render(); return;
  }
  if (a === "wtadd"){ wtAdd = el.dataset.w; wtAddIcon = null; wtAddName = ""; render(); return; }
  if (a === "wtcancel"){ wtAdd = null; wtAddIcon = null; wtAddName = ""; render(); return; }
  if (a === "wtselicon"){
    const inp = document.getElementById("wtname"); if (inp) wtAddName = inp.value;
    wtAddIcon = el.dataset.i; render(); return;
  }
  if (a === "wtsave"){
    const w = findWk(el.dataset.w); if (!w) return;
    const inp = document.getElementById("wtname");
    const name = ((inp && inp.value) || wtAddName || "").trim().toLowerCase();
    if (!name) return;
    if (!state.wtypes.some(t => t.name === name)) state.wtypes.push({ name, icon: wtAddIcon || "zap" });
    w.wtype = name;
    wtAdd = null; wtAddIcon = null; wtAddName = "";
    save(); render(); return;
  }
  if (a === "delwk"){
    const id = el.dataset.w;
    if (armed !== "delwk:" + id){ armed = "delwk:" + id; render(); return; }
    armed = null;
    state.backup = state.backup.filter(x => x.id !== id);
    state.workouts = state.workouts.filter(x => x.id !== id);
    if (wkOpen === id) wkOpen = null;
    if (editing === id) editing = false;
    save(); render(); return;
  }
  if (a === "edittgt"){ editTargets = !editTargets; render(); return; }

document.addEventListener("change", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.value;

  if (a === "pfile"){
    const files = [...(el.files || [])];
    el.value = "";
    if (files.length) Promise.all(files.map(addPhoto)).then(() => render());
    return;
  }
  if (a === "nrulef"){ const r = state.nutrition.rules.find(x => x.id === el.dataset.r); if (r){ r.name = v; save(); render(); } return; }
  if (a === "nrtarget"){ const r = state.nutrition.rules.find(x => x.id === el.dataset.r); if (r){ r.target = Math.max(r.kind === "limit" ? 0 : 1, num(v, r.target)); save(); render(); } return; }
  if (a === "nrunit"){ const r = state.nutrition.rules.find(x => x.id === el.dataset.r); if (r){ r.unit = v; save(); render(); } return; }
  if (a === "nmif"){ const m = findMenu(el.dataset.m); if (m && m.items && m.items[+el.dataset.i]){ m.items[+el.dataset.i].name = v; save(); render(); } return; }
  if (a === "nmiqty" || a === "nmiunit"){
    const m = findMenu(el.dataset.m); const it = m && m.items && m.items[+el.dataset.i]; if (!it) return;
    const p = parseAmt(it.amt);
    if (a === "nmiqty") p.qty = v; else p.unit = v;
    it.amt = joinAmt(p); save(); render(); return;
  }
  if (a === "xf"){ const x = state.nutrition.exclusions.find(y => y.id === el.dataset.x); if (x){ x.name = v; save(); render(); } return; }
  if (a === "xcost"){ const x = state.nutrition.exclusions.find(y => y.id === el.dataset.x); if (x){ x.cost = Math.max(0, num(v, x.cost ?? 1)); save(); render(); } return; }
  if (a === "xtname"){ const t = state.xtypes.find(z => z.id === el.dataset.t); if (t){ t.name = v; save(); render(); } return; }
  if (a === "xtlimit"){ const t = state.xtypes.find(z => z.id === el.dataset.t); if (t){ t.limit = Math.max(0, num(v, t.limit)); save(); render(); } return; }
  if (a === "xq" || a === "xu"){
    const x = state.nutrition.exclusions.find(y => y.id === el.dataset.x); if (!x) return;
    const p = parseAmt(x.amt);
    if (a === "xq") p.qty = v; else p.unit = v;
    x.amt = joinAmt(p); save(); render(); return;
  }
  if (a === "wktitle"){ const w = findWk(el.dataset.w); if (w){ w.title = v; save(); render(); } return; }
  if (a === "wkmins"){ const w = findWk(el.dataset.w); if (w){ w.mins = num(v, w.mins); save(); render(); } return; }
  if (a === "exf"){
    const w = findWk(el.dataset.w); if (!w) return;
    const ex = w.exercises.find(x => x.id === el.dataset.ex); if (!ex) return;
    const f = el.dataset.f;
    ex[f] = f === "name" ? v : num(v, ex[f]);
    save(); render(); return;
  }
  if (a === "rulef"){
    const r = state.rules.find(x => x.id === el.dataset.id); if (!r) return;
    const f = el.dataset.f;
    r[f] = (f === "scope" || f === "metric") ? v : (f === "cap" && v.trim() === "" ? "" : num(v, 0));
    save(); render(); return;
  }
  if (a === "prof"){
    const f = el.dataset.f;
    const tape = f === "heightCm" || f === "waistCm" || f === "neckCm";
    state.profile[f] = f === "mode" ? v : (tape && v.trim() === "") ? "" : num(v, num(state.profile[f]));
    let touchedNow = f === "weightNow" || f === "fatNow";
    if (tape){
      const tb = tapeBF(state.profile);
      if (tb.state === "ok"){ state.profile.fatNow = tb.bf; touchedNow = true; }
    }
    if (touchedNow){
      const date = iso(new Date());
      const w = num(state.profile.weightNow), ft = num(state.profile.fatNow);
      const found = state.measurements.find(m => m.date === date);
      if (found){ found.weight = w; found.fat = ft; } else state.measurements.push({ date, weight: w, fat: ft });
    }
    save(); render(); return;
  }
});

/* ---------- drag to reorder ---------- */
const DRAG_LISTS = {
  workouts: () => state.workouts,
  menu:     () => state.nutrition.menu,
  habits:   () => state.nutrition.rules,
  limits:   () => state.xtypes
};
// nested lists are addressed as "kind:parentId"; food/option rows have no ids, so they carry their index
function dragListFor(key){
  if (DRAG_LISTS[key]) return { list: DRAG_LISTS[key](), byIndex: false };
  const c = key.indexOf(":"); if (c < 0) return null;
  const kind = key.slice(0, c), id = key.slice(c + 1);
  if (kind === "exs"){ const w = state.workouts.find(x => x.id === id); return w ? { list: w.exercises = w.exercises || [], byIndex: false } : null; }
  if (kind === "xopts"){ return { list: state.nutrition.exclusions, byIndex: false }; }
  if (kind === "mfoods"){ const m = state.nutrition.menu.find(x => x.id === id); return m ? { list: m.items = m.items || [], byIndex: true } : null; }
  return null;
}
let drag = null;

function reorderSubset(list, ids){
  const idxs = ids.map(id => list.findIndex(x => x.id === id)).filter(i => i >= 0).sort((a, b) => a - b);
  const items = ids.map(id => list.find(x => x.id === id)).filter(Boolean);
  idxs.forEach((pos, k) => list[pos] = items[k]);
}

document.addEventListener("pointerdown", e => {
  const h = e.target.closest(".dragh");
  if (!h) return;
  const row = h.closest("[data-drag-row]");
  if (!row) return;
  e.preventDefault();
  drag = { key: h.dataset.drag, row, container: row.parentElement };
  row.classList.add("dragging");
  try { h.setPointerCapture(e.pointerId); } catch(err) {}
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  e.preventDefault();
  const rows = [...drag.container.querySelectorAll(":scope > [data-drag-row]")];
  const over = rows.find(r => r !== drag.row && (b => e.clientY > b.top && e.clientY < b.bottom)(r.getBoundingClientRect()));
  if (over){
    const b = over.getBoundingClientRect();
    if (e.clientY < b.top + b.height / 2) drag.container.insertBefore(drag.row, over);
    else drag.container.insertBefore(drag.row, over.nextSibling);
  }
}, { passive: false });
document.addEventListener("pointerup", () => {
  if (!drag) return;
  drag.row.classList.remove("dragging");
  const ids = [...drag.container.querySelectorAll(":scope > [data-drag-row]")].map(r => r.dataset.id);
  const t = dragListFor(drag.key);
  drag = null;
  if (t){
    if (t.byIndex){ const items = ids.map(i => t.list[+i]).filter(Boolean); t.list.splice(0, t.list.length, ...items); }
    else reorderSubset(t.list, ids);
    save();
  }
  render();
});
document.addEventListener("pointercancel", () => {
  if (!drag) return;
  drag.row.classList.remove("dragging");
  drag = null; render();
});

save();   // freeze today's (and any missed days') plan snapshot before first paint
render();
loadPhotos().then(render);   // photos arrive async from IndexedDB, repaint when ready
// installable app: register the service worker when served over http(s) with sw.js alongside
if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
